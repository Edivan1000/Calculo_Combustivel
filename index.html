<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Combustível</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<div class="container mt-4">

<h2>🚗 Controle de Combustível</h2>

<div class="row mt-3">

    <div class="col-md-3">
        <div class="card p-3">
            <h6>Total Abastecido</h6>
            <h4 id="totalAbastecido">R$ 0,00</h4>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card p-3">
            <h6>Autonomia</h6>
            <h4 id="autonomia">0 km</h4>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card p-3">
            <h6>Dias Cunhada</h6>
            <h4 id="diasCunhadaCard">0</h4>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card p-3">
            <h6>Valor a Receber</h6>
            <h4 id="valorReceber">R$ 0,00</h4>
        </div>
    </div>

    <div class="col-md-3">
    <div class="card p-3">
        <h6>Último Abastecimento</h6>
        <h4 id="ultimoAbastecimento">0 km</h4>
    </div>
</div>

<div class="col-md-3">
    <div class="card p-3">
        <h6>Autonomia Restante</h6>
        <h4 id="autonomiaRestante">0 km</h4>
    </div>
</div>

<div class="col-md-3">
    <div class="card p-3">
        <h6>KM Percorridos</h6>
        <h4 id="kmPercorridosCard">0 km</h4>
    </div>
</div>

</div>

<hr>

<button class="btn btn-primary" onclick="mostrarAba('combustivel')">
    🚗 Combustível
</button>

<button class="btn btn-success" onclick="mostrarAba('cunhada')">
    👥 Cunhada
</button>

<button class="btn btn-warning" onclick="mostrarAba('viagens')">
    🛣️ Viagens
</button>

<div id="abaViagens" style="display:none;">

    <h4>Registrar Viagem</h4>

    <input
        type="number"
        id="kmViagem"
        class="form-control mb-2"
        placeholder="KM percorridos">

    <button
        class="btn btn-warning"
        onclick="registrarViagem()">
        Registrar Viagem
    </button>

    <br><br>

    <button
        class="btn btn-secondary"
        onclick="trabalheiHoje()">
        Trabalhei Hoje
    </button>

    <br><br>

    <button
    class="btn btn-outline-danger"
    onclick="desfazerUltimoDia()">
    ↩️ Desfazer Último Dia
</button>

    <br><br>

<button
    class="btn btn-danger"
    onclick="zerarKmPercorridos()">
    🔄 Zerar KM Percorridos
</button>

</div>

<button class="btn btn-dark" onclick="mostrarAba('configuracoes')">
    ⚙️ Configurações
</button>

<hr>

<!-- ABA COMBUSTÍVEL -->

<div id="abaCombustivel">

    <h4>Novo Abastecimento</h4>

    <input
        type="date"
        id="dataAbastecimento"
        class="form-control mb-2">

    <input
        type="number"
        id="valorAbastecimento"
        class="form-control mb-2"
        placeholder="Valor abastecido">

    <button
        class="btn btn-success"
        onclick="salvarAbastecimento()">
        Salvar
    </button>

    <hr>

    <table class="table table-striped">

        <thead>
            <tr>
                <th>Data</th>
                <th>Valor</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="tabelaAbastecimentos"></tbody>

    </table>

</div>

<!-- ABA CUNHADA -->

<div id="abaCunhada" style="display:none;">

    <h4>Dias que a Cunhada Foi Junto</h4>

    <input
        type="number"
        id="diasCunhada"
        class="form-control mb-2"
        placeholder="Quantidade de dias">

    <button
        class="btn btn-primary"
        onclick="salvarDiasCunhada()">
        Calcular
    </button>

</div>

<!-- ABA CONFIGURAÇÕES -->

<div id="abaConfiguracoes" style="display:none;">

    <h4>⚙️ Configurações</h4>

    <label class="form-label">
        Consumo do veículo (km/L)
    </label>
    <input
        type="number"
        id="consumo"
        class="form-control mb-3">

    <label class="form-label">
        Preço do combustível (R$/L)
    </label>
    <input
        type="number"
        id="precoCombustivel"
        class="form-control mb-3">

    <label class="form-label">
        Distância diária total (KM)
    </label>
    <input
        type="number"
        id="distanciaDia"
        class="form-control mb-3">

    <label class="form-label">
        Participação da cunhada (%)
    </label>
    <input
        type="number"
        id="participacao"
        class="form-control mb-3">

    <button
        class="btn btn-success"
        onclick="salvarConfiguracoes()">
        Salvar Configurações
    </button>

</div>


</div>

<script src="app.js"></script>

</body>
</html>
